<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Track & Field 1984 (Hyper Olympic) - NES Edition 🏃‍♂️🏅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px;
    }

    /* Top Nav */
    .top-nav {
      position: absolute;
      top: 10px;
      left: 14px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      background: #222;
      border: 2px solid #555;
      color: #f7d51d;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 10px;
      text-decoration: none;
      font-family: inherit;
      transition: all 0.15s;
    }

    .nav-btn:hover {
      background: #f7d51d;
      color: #000;
      border-color: #fff;
    }

    /* NES TV / Arcade Outer Frame */
    .nes-frame {
      position: relative;
      width: 100%;
      max-width: 800px;
      background: #181818;
      border: 6px solid #444;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    /* Event Selection Bar */
    .event-selector {
      display: flex;
      width: 100%;
      max-width: 768px;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .event-btn {
      background: #000;
      border: 2px solid #666;
      color: #aaa;
      font-family: inherit;
      font-size: 9px;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
    }

    .event-btn.active {
      background: #b51a00;
      border-color: #fce453;
      color: #fce453;
      box-shadow: 0 0 8px rgba(252, 228, 83, 0.4);
    }

    /* Pure 4:3 Pixel Aspect Ratio Canvas (256x224 scaled to 768x448) */
    #nesCanvas {
      width: 100%;
      max-width: 768px;
      height: 448px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 4px solid #fff;
      display: block;
      background: #000;
      cursor: pointer;
    }

    /* NES Controller / Button Console */
    .nes-controller {
      width: 100%;
      max-width: 768px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 10px;
      gap: 12px;
    }

    .ctrl-btn {
      flex: 1;
      height: 54px;
      border-radius: 6px;
      border: 3px solid #eee;
      font-family: inherit;
      font-size: 11px;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.04s, box-shadow 0.04s;
    }

    .btn-run-left, .btn-run-right {
      background: #b51a00;
      box-shadow: 0 4px 0 #5b0000;
    }
    .btn-run-left:active, .btn-run-left.pressed,
    .btn-run-right:active, .btn-run-right.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5b0000;
      filter: brightness(1.2);
    }

    .btn-action-jump {
      background: #0078f8;
      box-shadow: 0 4px 0 #003680;
    }
    .btn-action-jump:active, .btn-action-jump.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #003680;
      filter: brightness(1.2);
    }

    .controls-hint {
      margin-top: 8px;
      font-size: 8px;
      color: #888;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="../index.html" class="nav-btn">🎮 All Games</a>
  </nav>

  <main class="nes-frame">
    <!-- Event Tabs -->
    <div class="event-selector">
      <button class="event-btn active" data-event="hurdles">110M HURDLES</button>
      <button class="event-btn" data-event="longjump">LONG JUMP</button>
      <button class="event-btn" data-event="javelin">JAVELIN THROW</button>
    </div>

    <!-- 256x224 Native NES Resolution Canvas -->
    <canvas id="nesCanvas" width="256" height="224"></canvas>

    <!-- Arcade Controller Panel -->
    <div class="nes-controller">
      <button class="ctrl-btn btn-run-left" id="btnRun1">
        <span>RUN 1</span>
        <span style="font-size: 8px; color: #fce453;">[ Z / ◄ ]</span>
      </button>

      <button class="ctrl-btn btn-action-jump" id="btnJump">
        <span id="actionLabel">JUMP</span>
        <span style="font-size: 8px; color: #fce453;">[ SPACE ]</span>
      </button>

      <button class="ctrl-btn btn-run-right" id="btnRun2">
        <span>RUN 2</span>
        <span style="font-size: 8px; color: #fce453;">[ X / ► ]</span>
      </button>
    </div>

    <p class="controls-hint" id="hintText">
      ALTERNATE [ Z ] AND [ X ] AS FAST AS POSSIBLE &bull; PRESS [ SPACE ] TO JUMP / SET ANGLE
    </p>
  </main>

  <script>
    /* Track & Field 1984 NES Edition - 100% Authentic NES Palette & Pixel Engine */
    (function () {
      'use strict';

      const canvas = document.getElementById('nesCanvas');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      // Authentic NES Color Palette
      const NES = {
        BLACK: '#000000',
        WHITE: '#fcfcfc',
        GRAY_DARK: '#747474',
        GRAY_LIGHT: '#bcbcbc',
        SKY_BLUE: '#3cbcfc',
        TARTAN_RED: '#b51a00',
        TARTAN_LINE: '#fcfcfc',
        SAND_YELLOW: '#e4a010',
        GRASS_GREEN: '#00a800',
        GRASS_DARK: '#006800',
        GOLD_YELLOW: '#fce453',
        SKIN_PEACH: '#fc9838',
        HAIR_BROWN: '#503000',
        P1_JERSEY: '#6b3df5', // Iconic NES Purple/Blue uniform
        P1_STRIPE: '#fcfcfc',
        CPU_JERSEY: '#0078f8',
        BARRIER_BLUE: '#0040a8'
      };

      let currentEvent = 'hurdles'; // 'hurdles' | 'longjump' | 'javelin'

      // Records
      function getRecords() {
        return {
          hurdles: parseFloat(localStorage.getItem('trackField_bestHurdles') || '0'),
          longjump: parseFloat(localStorage.getItem('trackField_bestLongJump') || '0'),
          javelin: parseFloat(localStorage.getItem('trackField_bestJavelin') || '0')
        };
      }

      // Event Switcher
      const eventButtons = document.querySelectorAll('.event-btn');
      const actionLabel = document.getElementById('actionLabel');
      const hintText = document.getElementById('hintText');

      eventButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          eventButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentEvent = btn.dataset.event;

          if (currentEvent === 'hurdles') {
            actionLabel.textContent = 'JUMP';
            hintText.innerHTML = 'ALTERNATE [ Z ] AND [ X ] TO SPRINT &bull; PRESS [ SPACE ] TO CLEAR HURDLES';
          } else if (currentEvent === 'longjump') {
            actionLabel.textContent = 'LEAP';
            hintText.innerHTML = 'SPRINT TO THE FOUL LINE &bull; HOLD [ SPACE ] FOR 45° AND RELEASE TO LEAP';
          } else if (currentEvent === 'javelin') {
            actionLabel.textContent = 'THROW';
            hintText.innerHTML = 'SPRINT TO SCRATCH LINE &bull; HOLD [ SPACE ] FOR 42° TRAJECTORY & RELEASE';
          }
          resetEvent();
        });
      });

      // Game States
      let state = 'READY'; // 'READY', 'RUNNING', 'ACTION', 'FINISHED'
      let countdown = 80;
      let timerMs = 0;
      let cameraX = 0;
      let lastTime = 0;

      // P1 Athlete
      const p1 = {
        x: 30,
        y: 146,
        baseY: 146,
        speed: 0,
        vx: 0,
        vy: 0,
        angleDeg: 0,
        isHoldingAction: false,
        lastFoot: null,
        knockTimer: 0,
        legFrame: 0,
        distanceM: 0,
        isFoul: false
      };

      // CPU Athlete (Lane 2 in Hurdles)
      const cpu = {
        x: 30,
        y: 196,
        baseY: 196,
        speed: 0,
        vy: 0,
        legFrame: 0,
        isJumping: false
      };

      // In-flight projectile (Javelin)
      const javelin = {
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        angleDeg: 0,
        active: false,
        landed: false
      };

      // 10 Hurdles for Lane 1 & Lane 2
      const hurdles = [];
      for (let i = 0; i < 9; i++) {
        hurdles.push({
          x: 200 + i * 140,
          knockedP1: false,
          knockedCpu: false
        });
      }

      function resetEvent() {
        state = 'READY';
        countdown = 80;
        timerMs = 0;
        cameraX = 0;

        p1.x = 30;
        p1.y = currentEvent === 'hurdles' ? 146 : 166;
        p1.baseY = p1.y;
        p1.speed = 0;
        p1.vx = 0;
        p1.vy = 0;
        p1.angleDeg = 0;
        p1.isHoldingAction = false;
        p1.knockTimer = 0;
        p1.lastFoot = null;
        p1.distanceM = 0;
        p1.isFoul = false;

        cpu.x = 30;
        cpu.speed = 0;
        cpu.vy = 0;
        cpu.isJumping = false;

        javelin.active = false;
        javelin.landed = false;

        hurdles.forEach(h => {
          h.knockedP1 = false;
          h.knockedCpu = false;
        });
      }

      // Input Mechanics
      function handleRun(foot) {
        if (state === 'READY' || state === 'FINISHED') return;
        if (p1.knockTimer <= 0) {
          if (p1.lastFoot !== foot) {
            p1.speed = Math.min(6.2, p1.speed + 0.58);
            p1.lastFoot = foot;
          } else {
            p1.speed = Math.max(0.5, p1.speed * 0.85); // Stumble
          }
        }
      }

      function handleActionPress() {
        if (state === 'FINISHED') {
          resetEvent();
          return;
        }
        if (state !== 'RUNNING') return;

        if (currentEvent === 'hurdles') {
          if (p1.y >= p1.baseY && p1.speed > 0.8) {
            p1.vy = -5.4;
          }
        } else if (currentEvent === 'longjump' || currentEvent === 'javelin') {
          p1.isHoldingAction = true;
        }
      }

      function handleActionRelease() {
        if (!p1.isHoldingAction || state !== 'RUNNING') return;
        p1.isHoldingAction = false;

        if (currentEvent === 'longjump') {
          const foulLine = 360;
          if (p1.x > foulLine) p1.isFoul = true;

          state = 'ACTION';
          const angle = Math.min(65, Math.max(25, p1.angleDeg || 45));
          const rad = (angle * Math.PI) / 180;
          p1.vx = p1.speed * Math.cos(rad) * 1.05;
          p1.vy = -p1.speed * Math.sin(rad) * 1.15;

        } else if (currentEvent === 'javelin') {
          const scratchLine = 370;
          if (p1.x > scratchLine) p1.isFoul = true;

          state = 'ACTION';
          javelin.active = true;
          javelin.x = p1.x + 8;
          javelin.y = p1.y - 8;
          const angle = Math.min(65, Math.max(20, p1.angleDeg || 42));
          const rad = (angle * Math.PI) / 180;
          javelin.vx = p1.speed * Math.cos(rad) * 1.45;
          javelin.vy = -p1.speed * Math.sin(rad) * 1.45;
          javelin.angleDeg = angle;
          p1.speed = 0;
        }
      }

      // Input Event Listeners
      const btnRun1 = document.getElementById('btnRun1');
      const btnRun2 = document.getElementById('btnRun2');
      const btnJump = document.getElementById('btnJump');

      btnRun1.addEventListener('pointerdown', (e) => { e.preventDefault(); handleRun(1); });
      btnRun2.addEventListener('pointerdown', (e) => { e.preventDefault(); handleRun(2); });
      btnJump.addEventListener('pointerdown', (e) => { e.preventDefault(); handleActionPress(); });
      window.addEventListener('pointerup', () => { handleActionRelease(); });

      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        if (e.code === 'KeyZ' || e.code === 'ArrowLeft') {
          btnRun1.classList.add('pressed');
          setTimeout(() => btnRun1.classList.remove('pressed'), 80);
          handleRun(1);
        } else if (e.code === 'KeyX' || e.code === 'ArrowRight') {
          btnRun2.classList.add('pressed');
          setTimeout(() => btnRun2.classList.remove('pressed'), 80);
          handleRun(2);
        } else if (e.code === 'Space' || e.code === 'ArrowUp') {
          e.preventDefault();
          btnJump.classList.add('pressed');
          handleActionPress();
        } else if (e.code === 'KeyR' || (state === 'FINISHED' && e.code === 'Enter')) {
          resetEvent();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          btnJump.classList.remove('pressed');
          handleActionRelease();
        }
      });

      canvas.addEventListener('pointerdown', () => {
        if (state === 'FINISHED') resetEvent();
      });

      // Main Loop
      function loop(now) {
        requestAnimationFrame(loop);
        const dt = lastTime ? Math.min(50, now - lastTime) : 16;
        lastTime = now;

        update(dt);
        render();
      }

      function update(dt) {
        if (state === 'READY') {
          countdown--;
          if (countdown <= 0) state = 'RUNNING';
          return;
        }

        // --- 110M HURDLES ---
        if (currentEvent === 'hurdles') {
          if (state === 'RUNNING') {
            timerMs += dt;

            // P1 Physics
            if (p1.knockTimer > 0) {
              p1.knockTimer--;
              p1.speed = 0;
            } else {
              p1.speed *= 0.97;
              p1.x += p1.speed;
            }

            if (p1.y < p1.baseY || p1.vy < 0) {
              p1.vy += 0.36; // Gravity
              p1.y += p1.vy;
              if (p1.y >= p1.baseY) {
                p1.y = p1.baseY;
                p1.vy = 0;
              }
            }

            // CPU AI
            cpu.speed = 4.2 + Math.sin(timerMs * 0.003) * 0.8;
            cpu.x += cpu.speed;
            for (let h of hurdles) {
              if (!cpu.isJumping && Math.abs(h.x - cpu.x) < 25 && !h.knockedCpu) {
                if (Math.random() < 0.9) {
                  cpu.isJumping = true;
                  cpu.vy = -5.4;
                } else {
                  h.knockedCpu = true;
                  cpu.speed = 1.0;
                }
              }
            }
            if (cpu.isJumping) {
              cpu.vy += 0.36;
              cpu.y += cpu.vy;
              if (cpu.y >= cpu.baseY) {
                cpu.y = cpu.baseY;
                cpu.vy = 0;
                cpu.isJumping = false;
              }
            }

            // Hurdle Collision for P1
            for (let h of hurdles) {
              if (!h.knockedP1 && Math.abs(p1.x - h.x) < 12) {
                if (p1.y > p1.baseY - 16) {
                  h.knockedP1 = true;
                  p1.knockTimer = 30;
                  p1.speed = 0;
                  p1.y = p1.baseY;
                }
              }
            }

            if (p1.speed > 0.3) p1.legFrame = Math.floor(timerMs / 80) % 4;
            if (cpu.speed > 0.3) cpu.legFrame = Math.floor(timerMs / 85) % 4;

            cameraX = Math.max(0, p1.x - 70);

            // Finish at 1450 px
            if (p1.x >= 1450) {
              state = 'FINISHED';
              const finalSec = timerMs / 1000;
              const rec = getRecords();
              if (rec.hurdles === 0 || finalSec < rec.hurdles) {
                localStorage.setItem('trackField_bestHurdles', finalSec);
                localStorage.setItem('trackField_bestTime', finalSec);
              }
            }
          }
        }

        // --- LONG JUMP ---
        else if (currentEvent === 'longjump') {
          const foulLine = 360;
          if (state === 'RUNNING') {
            p1.speed *= 0.985;
            p1.x += p1.speed;
            if (p1.isHoldingAction) p1.angleDeg = (p1.angleDeg + 2.8) % 90;
            if (p1.speed > 0.3) p1.legFrame = Math.floor(p1.x / 10) % 4;
            if (p1.x > foulLine + 30) {
              p1.isFoul = true;
              state = 'FINISHED';
            }
          } else if (state === 'ACTION') {
            p1.x += p1.vx;
            p1.vy += 0.32;
            p1.y += p1.vy;
            if (p1.y >= p1.baseY) {
              p1.y = p1.baseY;
              state = 'FINISHED';
              if (!p1.isFoul) {
                const distPx = Math.max(0, p1.x - foulLine);
                p1.distanceM = Math.min(8.95, 5.80 + distPx / 28);
                const rec = getRecords();
                if (p1.distanceM > rec.longjump) {
                  localStorage.setItem('trackField_bestLongJump', p1.distanceM);
                }
              }
            }
          }
          cameraX = Math.max(0, p1.x - 80);
        }

        // --- JAVELIN THROW ---
        else if (currentEvent === 'javelin') {
          const scratchLine = 370;
          if (state === 'RUNNING') {
            p1.speed *= 0.985;
            p1.x += p1.speed;
            if (p1.isHoldingAction) p1.angleDeg = (p1.angleDeg + 2.5) % 85;
            if (p1.speed > 0.3) p1.legFrame = Math.floor(p1.x / 10) % 4;
            if (p1.x > scratchLine + 25) {
              p1.isFoul = true;
              state = 'FINISHED';
            }
          } else if (state === 'ACTION') {
            javelin.x += javelin.vx;
            javelin.vy += 0.28;
            javelin.y += javelin.vy;
            javelin.angleDeg = (Math.atan2(javelin.vy, javelin.vx) * 180) / Math.PI;

            if (javelin.y >= p1.baseY + 8) {
              javelin.y = p1.baseY + 8;
              javelin.active = false;
              javelin.landed = true;
              state = 'FINISHED';
              if (!p1.isFoul) {
                const distPx = Math.max(0, javelin.x - scratchLine);
                p1.distanceM = Math.min(98.8, 48.0 + distPx / 12);
                const rec = getRecords();
                if (p1.distanceM > rec.javelin) {
                  localStorage.setItem('trackField_bestJavelin', p1.distanceM);
                }
              }
            }
            cameraX = Math.max(0, javelin.x - 120);
          }
        }
      }

      // =========================================================================
      // NES VISUAL RENDERING ENGINE
      // =========================================================================
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Top Black Letterbox Area for NES Scoreboard
        ctx.fillStyle = NES.BLACK;
        ctx.fillRect(0, 0, canvas.width, 42);

        drawNESScoreboard();

        // 2. Stadium Crowd (Iconic repetitive 8-bit spectators in stands)
        drawNESGrandstands();

        // 3. Stadium Wall Barrier with classic Blue Logo Stripe
        ctx.fillStyle = NES.BARRIER_BLUE;
        ctx.fillRect(0, 96, canvas.width, 16);
        ctx.fillStyle = NES.WHITE;
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillText('KONAMI HYPER OLYMPIC', 10 - (cameraX * 0.2) % 180, 108);

        // 4. Tartan Track or Field
        if (currentEvent === 'hurdles') {
          drawNESHurdlesTrack();
        } else if (currentEvent === 'longjump') {
          drawNESLongJumpField();
        } else if (currentEvent === 'javelin') {
          drawNESJavelinField();
        }

        // 5. NES Speed Gauge / Power Meter (Bottom Left)
        drawNESSpeedMeter();

        // 6. Overlays
        if (state === 'READY') {
          ctx.fillStyle = NES.BLACK;
          ctx.fillRect(40, 115, 176, 26);
          ctx.strokeStyle = NES.WHITE;
          ctx.lineWidth = 1;
          ctx.strokeRect(40, 115, 176, 26);
          ctx.fillStyle = NES.GOLD_YELLOW;
          ctx.font = '8px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(countdown > 35 ? 'ON YOUR MARKS...' : 'SET... BANG! 🔫', 128, 131);
          ctx.textAlign = 'start';
        } else if (state === 'FINISHED') {
          ctx.fillStyle = NES.BLACK;
          ctx.fillRect(30, 90, 196, 50);
          ctx.strokeStyle = NES.WHITE;
          ctx.lineWidth = 1;
          ctx.strokeRect(30, 90, 196, 50);
          ctx.textAlign = 'center';

          if (p1.isFoul) {
            ctx.fillStyle = '#ff1744';
            ctx.font = '10px "Press Start 2P", monospace';
            ctx.fillText('FOUL! ❌', 128, 110);
            ctx.fillStyle = NES.WHITE;
            ctx.font = '7px "Press Start 2P", monospace';
            ctx.fillText('CROSSED LINE BEFORE LEAP', 128, 128);
          } else {
            ctx.fillStyle = NES.GOLD_YELLOW;
            ctx.font = '9px "Press Start 2P", monospace';
            ctx.fillText('EVENT COMPLETE! 🏅', 128, 108);
            ctx.fillStyle = NES.WHITE;
            ctx.font = '8px "Press Start 2P", monospace';
            if (currentEvent === 'hurdles') {
              ctx.fillText(`TIME: ${(timerMs / 1000).toFixed(2)} SEC`, 128, 122);
            } else {
              ctx.fillText(`RECORD: ${p1.distanceM.toFixed(2)} M`, 128, 122);
            }
          }
          ctx.textAlign = 'start';
        }

        // Angle Indicator
        if (p1.isHoldingAction && state === 'RUNNING') {
          ctx.fillStyle = NES.BLACK;
          ctx.fillRect(p1.x - cameraX + 4, p1.y - 28, 30, 12);
          ctx.fillStyle = NES.GOLD_YELLOW;
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillText(`${Math.floor(p1.angleDeg)}°`, p1.x - cameraX + 6, p1.y - 19);
        }
      }

      // --- NES SCOREBOARD HEADER ---
      function drawNESScoreboard() {
        ctx.fillStyle = NES.WHITE;
        ctx.font = '8px "Press Start 2P", monospace';

        const recs = getRecords();

        // Row 1: Player & High Score
        ctx.fillText('1P', 8, 14);
        ctx.fillText('RECORD', 84, 14);
        ctx.fillText('TIME', 196, 14);

        // Row 2: Values in Gold / Sky Blue
        ctx.fillStyle = NES.GOLD_YELLOW;
        if (currentEvent === 'hurdles') {
          const curTime = (timerMs / 1000).toFixed(2);
          ctx.fillText(`${curTime}S`, 8, 28);
          ctx.fillText(recs.hurdles > 0 ? `${recs.hurdles.toFixed(2)}S` : '14.50S', 84, 28);
          ctx.fillStyle = NES.SKY_BLUE;
          ctx.fillText(`${curTime}S`, 196, 28);
        } else if (currentEvent === 'longjump') {
          ctx.fillText(`${p1.distanceM.toFixed(2)}M`, 8, 28);
          ctx.fillText(recs.longjump > 0 ? `${recs.longjump.toFixed(2)}M` : '8.50M', 84, 28);
          ctx.fillStyle = NES.SKY_BLUE;
          ctx.fillText('QUAL: 7.5M', 160, 28);
        } else if (currentEvent === 'javelin') {
          ctx.fillText(`${p1.distanceM.toFixed(2)}M`, 8, 28);
          ctx.fillText(recs.javelin > 0 ? `${recs.javelin.toFixed(2)}M` : '85.0M', 84, 28);
          ctx.fillStyle = NES.SKY_BLUE;
          ctx.fillText('QUAL: 70.0M', 152, 28);
        }

        // NES White separating line
        ctx.fillStyle = NES.WHITE;
        ctx.fillRect(0, 36, canvas.width, 2);
      }

      // --- NES SPECTATOR STANDS ---
      function drawNESGrandstands() {
        // Flat sky or stands backdrop
        ctx.fillStyle = '#1c1c1c';
        ctx.fillRect(0, 38, canvas.width, 58);

        // Rows of 8-bit spectators
        const spectatorShirts = ['#d82800', '#0078f8', '#00a800', '#fce453', '#ffffff', '#800080'];
        for (let row = 0; row < 4; row++) {
          const y = 42 + row * 13;
          // Bench row line
          ctx.fillStyle = '#404040';
          ctx.fillRect(0, y + 10, canvas.width, 3);

          for (let col = 0; col < 22; col++) {
            const x = (col * 14) - (cameraX * 0.15) % 14;
            const color = spectatorShirts[(col + row * 3) % spectatorShirts.length];

            // Head (Peach)
            ctx.fillStyle = NES.SKIN_PEACH;
            ctx.fillRect(x + 2, y, 4, 4);
            // Hair
            ctx.fillStyle = NES.HAIR_BROWN;
            ctx.fillRect(x + 2, y, 4, 1);
            // Shirt
            ctx.fillStyle = color;
            ctx.fillRect(x + 1, y + 4, 6, 6);
          }
        }
      }

      // --- 110M HURDLES TRACK ---
      function drawNESHurdlesTrack() {
        // Red tartan track surface
        ctx.fillStyle = NES.TARTAN_RED;
        ctx.fillRect(0, 112, canvas.width, 112);

        // White Lane Stripes
        ctx.fillStyle = NES.TARTAN_LINE;
        ctx.fillRect(0, 112, canvas.width, 2);
        ctx.fillRect(0, 162, canvas.width, 2);
        ctx.fillRect(0, 212, canvas.width, 2);

        // Finish Line Tape at 1450
        const finX = 1450 - cameraX;
        if (finX > -20 && finX < 280) {
          ctx.fillStyle = NES.WHITE;
          ctx.fillRect(finX, 112, 4, 102);
          ctx.fillStyle = NES.GOLD_YELLOW;
          ctx.fillRect(finX + 4, 112, 4, 102);
        }

        // Draw Hurdles
        for (let h of hurdles) {
          const sx = h.x - cameraX;
          if (sx > -20 && sx < 276) {
            drawNESHurdle(sx, p1.baseY + 4, h.knockedP1);
            drawNESHurdle(sx, cpu.baseY + 4, h.knockedCpu);
          }
        }

        // Draw CPU Runner (Blue)
        drawNESAthlete(cpu.x - cameraX, cpu.y, NES.CPU_JERSEY, cpu.legFrame, cpu.isJumping, false);

        // Draw Player Runner (Iconic Mustache purple athlete)
        drawNESAthlete(p1.x - cameraX, p1.y, NES.P1_JERSEY, p1.legFrame, p1.y < p1.baseY, p1.knockTimer > 0);
      }

      // --- LONG JUMP SAND PIT & RUNWAY ---
      function drawNESLongJumpField() {
        ctx.fillStyle = NES.TARTAN_RED;
        ctx.fillRect(0, 112, canvas.width, 112);

        const foulLine = 360;
        const screenFoulX = foulLine - cameraX;

        // Takeoff Board (White) & Plasticine Indicator (Red)
        if (screenFoulX > -30 && screenFoulX < 280) {
          ctx.fillStyle = NES.WHITE;
          ctx.fillRect(screenFoulX - 10, 158, 10, 24);
          ctx.fillStyle = '#d82800';
          ctx.fillRect(screenFoulX, 158, 4, 24);
        }

        // Sand Pit
        const pitStart = screenFoulX + 4;
        if (pitStart < 280) {
          ctx.fillStyle = NES.SAND_YELLOW;
          ctx.fillRect(Math.max(0, pitStart), 154, Math.max(0, canvas.width - pitStart), 32);

          // Distance markers
          ctx.fillStyle = NES.BLACK;
          ctx.font = '6px "Press Start 2P", monospace';
          for (let m = 7; m <= 9; m++) {
            const mx = (foulLine + (m - 5.8) * 28) - cameraX;
            if (mx > 0 && mx < canvas.width) {
              ctx.fillText(`${m}M`, mx, 172);
              ctx.fillRect(mx - 1, 155, 2, 6);
            }
          }
        }

        drawNESAthlete(p1.x - cameraX, p1.y, NES.P1_JERSEY, p1.legFrame, state === 'ACTION', false);
      }

      // --- JAVELIN THROW FIELD ---
      function drawNESJavelinField() {
        ctx.fillStyle = NES.TARTAN_RED;
        ctx.fillRect(0, 112, canvas.width, 112);

        const scratchLine = 370;
        const screenScratchX = scratchLine - cameraX;

        // Lush Green Grass Field
        if (screenScratchX < 280) {
          ctx.fillStyle = NES.GRASS_GREEN;
          ctx.fillRect(Math.max(0, screenScratchX), 112, Math.max(0, canvas.width - screenScratchX), 112);

          // White scratch arc
          ctx.fillStyle = NES.WHITE;
          ctx.fillRect(screenScratchX - 2, 140, 4, 52);

          // Distance lines
          ctx.fillStyle = NES.WHITE;
          ctx.font = '6px "Press Start 2P", monospace';
          for (let m = 50; m <= 90; m += 10) {
            const mx = (scratchLine + (m - 48) * 12) - cameraX;
            if (mx > 0 && mx < canvas.width) {
              ctx.fillText(`${m}M`, mx, 134);
              ctx.fillRect(mx, 138, 2, 56);
            }
          }
        }

        drawNESAthlete(p1.x - cameraX, p1.y, NES.P1_JERSEY, p1.legFrame, false, false);

        // In-flight or grounded Javelin Spear
        if (javelin.active || javelin.landed) {
          ctx.save();
          ctx.translate(javelin.x - cameraX, javelin.y);
          ctx.rotate((javelin.angleDeg * Math.PI) / 180);
          ctx.fillStyle = NES.GRAY_LIGHT;
          ctx.fillRect(-16, -1, 32, 2);
          ctx.fillStyle = '#b51a00';
          ctx.fillRect(-3, -1, 6, 2); // Red grip
          ctx.fillStyle = NES.GOLD_YELLOW;
          ctx.fillRect(14, -1, 3, 2); // Golden tip
          ctx.restore();
        } else if (state === 'RUNNING') {
          // Held spear
          ctx.save();
          ctx.translate(p1.x - cameraX + 6, p1.y - 8);
          ctx.rotate((-22 * Math.PI) / 180);
          ctx.fillStyle = NES.GRAY_LIGHT;
          ctx.fillRect(-14, -1, 28, 2);
          ctx.restore();
        }
      }

      // --- AUTHENTIC 8-BIT HURDLE SPRITE ---
      function drawNESHurdle(x, y, knocked) {
        if (!knocked) {
          // Standing Hurdle (Black & White stripes with metal feet)
          ctx.fillStyle = NES.WHITE;
          ctx.fillRect(x, y - 18, 4, 18);
          ctx.fillStyle = NES.BLACK;
          ctx.fillRect(x, y - 18, 4, 4);
          ctx.fillRect(x, y - 10, 4, 4);
          // Base feet
          ctx.fillStyle = NES.GRAY_LIGHT;
          ctx.fillRect(x - 3, y - 1, 10, 2);
        } else {
          // Knocked over flat hurdle
          ctx.fillStyle = NES.WHITE;
          ctx.fillRect(x - 6, y - 2, 18, 3);
          ctx.fillStyle = NES.BLACK;
          ctx.fillRect(x - 2, y - 2, 4, 3);
        }
      }

      // --- ICONIC NES ATHLETE SPRITE (WITH PURPLE SUIT & MUSTACHE) ---
      function drawNESAthlete(x, y, jerseyColor, legFrame, isAirborne, isTripped) {
        if (isTripped) {
          // Faceplant on the ground
          ctx.fillStyle = NES.SKIN_PEACH;
          ctx.fillRect(x + 10, y + 2, 6, 6); // Head
          ctx.fillStyle = jerseyColor;
          ctx.fillRect(x, y + 4, 12, 5); // Torso
          ctx.fillStyle = NES.WHITE;
          ctx.fillRect(x - 8, y + 5, 8, 4); // Legs
          return;
        }

        // 1. Hair & Headband
        ctx.fillStyle = NES.HAIR_BROWN;
        ctx.fillRect(x + 2, y - 20, 8, 4);
        ctx.fillStyle = NES.WHITE;
        ctx.fillRect(x + 2, y - 18, 8, 2); // White headband

        // 2. Face (Peach)
        ctx.fillStyle = NES.SKIN_PEACH;
        ctx.fillRect(x + 3, y - 16, 7, 6);

        // 3. Iconic Mustache & Eye (Brown & Black)
        ctx.fillStyle = NES.BLACK;
        ctx.fillRect(x + 8, y - 15, 1, 2); // Eye
        ctx.fillStyle = NES.HAIR_BROWN;
        ctx.fillRect(x + 7, y - 12, 4, 2); // Mustache!

        // 4. Jersey (Purple/Blue with White tank stripes)
        ctx.fillStyle = jerseyColor;
        ctx.fillRect(x + 2, y - 10, 8, 9);
        ctx.fillStyle = NES.WHITE;
        ctx.fillRect(x + 3, y - 10, 2, 9); // Left stripe
        ctx.fillRect(x + 7, y - 10, 2, 9); // Right stripe

        // 5. White Running Shorts
        ctx.fillStyle = NES.WHITE;
        ctx.fillRect(x + 2, y - 1, 8, 5);

        // 6. Animated 8-bit Running Legs & Cleats
        ctx.fillStyle = NES.SKIN_PEACH;

        if (isAirborne) {
          // Olympic Hurdle Split Pose
          ctx.fillRect(x + 8, y + 3, 10, 3); // Front leg
          ctx.fillRect(x - 8, y + 3, 8, 3);  // Back leg
          ctx.fillStyle = NES.WHITE;
          ctx.fillRect(x + 16, y + 2, 3, 3); // Front shoe
          ctx.fillRect(x - 9, y + 2, 3, 3);  // Back shoe
        } else {
          // 4-frame NES sprint stride
          if (legFrame === 0) {
            ctx.fillRect(x + 3, y + 4, 3, 9);
            ctx.fillRect(x + 7, y + 4, 3, 6);
            ctx.fillStyle = NES.WHITE;
            ctx.fillRect(x + 3, y + 12, 4, 2);
            ctx.fillRect(x + 7, y + 9, 4, 2);
          } else if (legFrame === 1) {
            ctx.fillRect(x, y + 4, 4, 8);
            ctx.fillRect(x + 8, y + 4, 4, 8);
            ctx.fillStyle = NES.WHITE;
            ctx.fillRect(x, y + 11, 4, 2);
            ctx.fillRect(x + 8, y + 11, 4, 2);
          } else if (legFrame === 2) {
            ctx.fillRect(x + 3, y + 4, 3, 6);
            ctx.fillRect(x + 7, y + 4, 3, 9);
            ctx.fillStyle = NES.WHITE;
            ctx.fillRect(x + 3, y + 9, 4, 2);
            ctx.fillRect(x + 7, y + 12, 4, 2);
          } else {
            ctx.fillRect(x + 2, y + 4, 7, 7);
            ctx.fillStyle = NES.WHITE;
            ctx.fillRect(x + 2, y + 10, 5, 2);
          }
        }
      }

      // --- NES SPEED GAUGE ---
      function drawNESSpeedMeter() {
        ctx.fillStyle = NES.BLACK;
        ctx.fillRect(8, 206, 90, 12);
        ctx.fillStyle = NES.WHITE;
        ctx.font = '6px "Press Start 2P", monospace';
        ctx.fillText('SPEED', 12, 214);

        // Segmented Power Bars (Red & Gold)
        const maxBars = 10;
        const currentBars = Math.min(maxBars, Math.floor((p1.speed / 6.2) * maxBars));
        for (let b = 0; b < currentBars; b++) {
          ctx.fillStyle = b < 7 ? NES.GOLD_YELLOW : '#ff1744';
          ctx.fillRect(45 + b * 5, 208, 4, 7);
        }
      }

      resetEvent();
      requestAnimationFrame(loop);

    })();
  </script>
