<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Track & Field 1984 (Hyper Olympic) 🏃‍♂️🏅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #111;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
    }

    /* Top Navigation */
    .top-nav {
      position: absolute;
      top: 14px;
      left: 18px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffd700;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-family: inherit;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: #ffd700;
      color: #111;
    }

    /* Main NES Arcade Frame */
    .arcade-wrapper {
      position: relative;
      width: 100%;
      max-width: 840px;
      background: #2b2b2b;
      border: 8px solid #555;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    /* Olympic Event Tabs */
    .event-tabs {
      display: flex;
      width: 100%;
      max-width: 780px;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid #777;
      border-radius: 8px;
      color: #aaa;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: #fff;
      border-color: #ffd700;
    }

    .tab-btn.active {
      background: #b71c1c;
      color: #ffd700;
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .olympic-header {
      width: 100%;
      max-width: 780px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #ffe600;
      margin-bottom: 10px;
      padding: 0 8px;
    }

    #gameCanvas {
      width: 100%;
      max-width: 780px;
      height: 380px;
      background: #000;
      border: 4px solid #fff;
      display: block;
      cursor: pointer;
    }

    /* Arcade Physical Push Buttons (Run 1, Action, Run 2) */
    .olympic-console {
      width: 100%;
      max-width: 780px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 14px;
      gap: 14px;
    }

    .console-btn {
      flex: 1;
      height: 64px;
      border-radius: 14px;
      border: 4px solid #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.05s, box-shadow 0.05s;
    }

    .btn-run {
      background: linear-gradient(180deg, #ff3366, #b3002d);
      box-shadow: 0 6px 0 #66001a;
    }

    .btn-run:active, .btn-run.pressed {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #66001a;
    }

    .btn-action {
      background: linear-gradient(180deg, #00d2ff, #007799);
      box-shadow: 0 6px 0 #004455;
    }

    .btn-action:active, .btn-action.pressed {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #004455;
    }

    .controls-hint {
      margin-top: 14px;
      font-size: 9px;
      color: #aaa;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="../index.html" class="nav-btn">🎮 All Games</a>
  </nav>

  <main class="arcade-wrapper">
    <!-- Olympic Event Tabs -->
    <div class="event-tabs">
      <button class="tab-btn active" data-event="hurdles">🏃 110M HURDLES</button>
      <button class="tab-btn" data-event="longjump">👟 LONG JUMP</button>
      <button class="tab-btn" data-event="javelin">🎯 JAVELIN THROW</button>
    </div>

    <div class="olympic-header">
      <div id="eventTitle">EVENT: 110M HURDLES</div>
      <div>RECORD: <span id="recordText">14.50S</span></div>
      <div id="currentStat">TIME: <span id="statValue" style="color: #00e5ff;">0.00S</span></div>
    </div>

    <canvas id="gameCanvas" width="780" height="380"></canvas>

    <div class="olympic-console">
      <button class="console-btn btn-run" id="btnRun1">
        <span>RUN L</span>
        <span style="font-size: 8px; color: #ffd700;">[ Z / ◄ ]</span>
      </button>

      <button class="console-btn btn-action" id="btnAction">
        <span id="actionBtnLabel">JUMP</span>
        <span style="font-size: 8px; color: #ffd700;">[ SPACE ]</span>
      </button>

      <button class="console-btn btn-run" id="btnRun2">
        <span>RUN R</span>
        <span style="font-size: 8px; color: #ffd700;">[ X / ► ]</span>
      </button>
    </div>

    <p class="controls-hint" id="controlsHint">
      ALTERNATE <kbd>Z</kbd> & <kbd>X</kbd> (or <kbd>◄</kbd> & <kbd>►</kbd>) RAPIDLY TO SPRINT &bull; PRESS <kbd>SPACE</kbd> TO JUMP!
    </p>
  </main>

  <script>
    /* Retro Track & Field 1984 (Hyper Olympic) - Complete 3-Event Olympic Arcade */
    (function () {
      'use strict';

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const eventTitle = document.getElementById('eventTitle');
      const recordText = document.getElementById('recordText');
      const currentStat = document.getElementById('currentStat');
      const statValue = document.getElementById('statValue');
      const actionBtnLabel = document.getElementById('actionBtnLabel');
      const controlsHint = document.getElementById('controlsHint');

      const btnRun1 = document.getElementById('btnRun1');
      const btnRun2 = document.getElementById('btnRun2');
      const btnAction = document.getElementById('btnAction');
      const tabs = document.querySelectorAll('.tab-btn');

      let currentEvent = 'hurdles'; // 'hurdles' | 'longjump' | 'javelin'

      // Records in localStorage
      function getRecords() {
        return {
          hurdles: parseFloat(localStorage.getItem('trackField_bestHurdles') || '0'),
          longjump: parseFloat(localStorage.getItem('trackField_bestLongJump') || '0'),
          javelin: parseFloat(localStorage.getItem('trackField_bestJavelin') || '0')
        };
      }

      function updateRecordDisplay() {
        const records = getRecords();
        if (currentEvent === 'hurdles') {
          eventTitle.textContent = 'EVENT: 110M HURDLES';
          actionBtnLabel.textContent = 'JUMP';
          controlsHint.innerHTML = 'ALTERNATE <kbd>Z</kbd> & <kbd>X</kbd> TO SPRINT &bull; PRESS <kbd>SPACE</kbd> TO CLEAR HURDLES!';
          recordText.textContent = records.hurdles > 0 ? `${records.hurdles.toFixed(2)}S` : 'NONE';
        } else if (currentEvent === 'longjump') {
          eventTitle.textContent = 'EVENT: LONG JUMP';
          actionBtnLabel.textContent = 'JUMP (HOLD)';
          controlsHint.innerHTML = 'SPRINT TO THE FOUL LINE &bull; HOLD <kbd>SPACE</kbd> TO SET 45° ANGLE & RELEASE TO LEAP!';
          recordText.textContent = records.longjump > 0 ? `${records.longjump.toFixed(2)}M` : 'NONE';
        } else if (currentEvent === 'javelin') {
          eventTitle.textContent = 'EVENT: JAVELIN THROW';
          actionBtnLabel.textContent = 'THROW (HOLD)';
          controlsHint.innerHTML = 'SPRINT TO THE SCRATCH LINE &bull; HOLD <kbd>SPACE</kbd> FOR 42° TRAJECTORY & LAUNCH!';
          recordText.textContent = records.javelin > 0 ? `${records.javelin.toFixed(2)}M` : 'NONE';
        }
      }

      // Event Switching
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentEvent = tab.dataset.event;
          updateRecordDisplay();
          resetEvent();
        });
      });

      // State
      let state = 'READY'; // 'READY' | 'RUNNING' | 'ACTION' | 'FINISHED'
      let countdown = 80;
      let timerMs = 0;
      let lastTime = 0;
      let cameraX = 0;

      // Athlete Object
      const athlete = {
        x: 60,
        y: 270,
        baseY: 270,
        speed: 0,
        vx: 0,
        vy: 0,
        angleDeg: 0,
        isHoldingAction: false,
        lastFoot: null,
        knockTimer: 0,
        legFrame: 0,
        distanceMeters: 0,
        isFoul: false
      };

      // Projectile (Javelin / In-Flight Jumper)
      const projectile = {
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        angleDeg: 0,
        active: false,
        landed: false
      };

      // Hurdles (Event 1)
      const hurdles = [];
      for (let i = 0; i < 9; i++) {
        hurdles.push({ x: 340 + i * 220, knocked: false });
      }

      function resetEvent() {
        state = 'READY';
        countdown = 80;
        timerMs = 0;
        cameraX = 0;

        athlete.x = 60;
        athlete.y = 270;
        athlete.speed = 0;
        athlete.vx = 0;
        athlete.vy = 0;
        athlete.angleDeg = 0;
        athlete.isHoldingAction = false;
        athlete.knockTimer = 0;
        athlete.lastFoot = null;
        athlete.distanceMeters = 0;
        athlete.isFoul = false;

        projectile.active = false;
        projectile.landed = false;

        hurdles.forEach(h => h.knocked = false);
        statValue.textContent = currentEvent === 'hurdles' ? '0.00S' : '0.00M';
      }

      function handleRun(foot) {
        if (state === 'READY' || state === 'FINISHED') return;

        if (athlete.knockTimer <= 0) {
          if (athlete.lastFoot !== foot) {
            athlete.speed = Math.min(14.5, athlete.speed + 1.25);
            athlete.lastFoot = foot;
          } else {
            athlete.speed = Math.max(1, athlete.speed * 0.82); // Stumble penalty
          }
        }
      }

      function handleActionPress() {
        if (state === 'FINISHED') {
          resetEvent();
          return;
        }

        if (state !== 'RUNNING') return;

        if (currentEvent === 'hurdles') {
          // Standard Hurdle Jump
          if (athlete.y >= athlete.baseY && athlete.speed > 1.5) {
            athlete.vy = -10.5;
          }
        } else if (currentEvent === 'longjump' || currentEvent === 'javelin') {
          // Start Angle Charging
          athlete.isHoldingAction = true;
        }
      }

      function handleActionRelease() {
        if (!athlete.isHoldingAction || state !== 'RUNNING') return;
        athlete.isHoldingAction = false;

        if (currentEvent === 'longjump') {
          // Long Jump Leap!
          const foulLine = 580;
          if (athlete.x > foulLine) {
            athlete.isFoul = true;
          }

          state = 'ACTION';
          const launchAngle = Math.min(65, Math.max(25, athlete.angleDeg || 45));
          const rad = (launchAngle * Math.PI) / 180;
          athlete.vx = athlete.speed * Math.cos(rad) * 1.05;
          athlete.vy = -athlete.speed * Math.sin(rad) * 1.25;

        } else if (currentEvent === 'javelin') {
          // Javelin Release Throw!
          const scratchLine = 600;
          if (athlete.x > scratchLine) {
            athlete.isFoul = true;
          }

          state = 'ACTION';
          projectile.active = true;
          projectile.x = athlete.x + 15;
          projectile.y = athlete.y - 12;
          const throwAngle = Math.min(65, Math.max(20, athlete.angleDeg || 42));
          const rad = (throwAngle * Math.PI) / 180;
          projectile.vx = athlete.speed * Math.cos(rad) * 1.5;
          projectile.vy = -athlete.speed * Math.sin(rad) * 1.6;
          projectile.angleDeg = throwAngle;

          athlete.speed = 0; // Athlete halts at scratch line
        }
      }

      // Input Event Handlers
      btnRun1.addEventListener('pointerdown', (e) => { e.preventDefault(); handleRun(1); });
      btnRun2.addEventListener('pointerdown', (e) => { e.preventDefault(); handleRun(2); });
      btnAction.addEventListener('pointerdown', (e) => { e.preventDefault(); handleActionPress(); });
      window.addEventListener('pointerup', () => { handleActionRelease(); });

      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;

        if (e.code === 'KeyZ' || e.code === 'ArrowLeft') {
          btnRun1.classList.add('pressed');
          setTimeout(() => btnRun1.classList.remove('pressed'), 80);
          handleRun(1);
        } else if (e.code === 'KeyX' || e.code === 'ArrowRight') {
          btnRun2.classList.add('pressed');
          setTimeout(() => btnRun2.classList.remove('pressed'), 80);
          handleRun(2);
        } else if (e.code === 'Space' || e.code === 'ArrowUp') {
          e.preventDefault();
          btnAction.classList.add('pressed');
          handleActionPress();
        } else if (e.code === 'KeyR' || (state === 'FINISHED' && e.code === 'Enter')) {
          resetEvent();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          btnAction.classList.remove('pressed');
          handleActionRelease();
        }
      });

      // Main Loop
      function loop(now) {
        requestAnimationFrame(loop);
        const dt = lastTime ? Math.min(50, now - lastTime) : 16;
        lastTime = now;

        update(dt);
        render();
      }

      function update(dt) {
        if (state === 'READY') {
          countdown--;
          if (countdown <= 0) {
            state = 'RUNNING';
          }
          return;
        }

        // ==========================
        // 1. EVENT: 110M HURDLES
        // ==========================
        if (currentEvent === 'hurdles') {
          if (state === 'RUNNING') {
            timerMs += dt;
            statValue.textContent = `${(timerMs / 1000).toFixed(2)}S`;

            if (athlete.knockTimer > 0) {
              athlete.knockTimer--;
              athlete.speed = 0;
            } else {
              athlete.speed *= 0.965;
              athlete.x += athlete.speed;
            }

            // Jump gravity
            if (athlete.y < athlete.baseY || athlete.vy < 0) {
              athlete.vy += 0.65;
              athlete.y += athlete.vy;
              if (athlete.y >= athlete.baseY) {
                athlete.y = athlete.baseY;
                athlete.vy = 0;
              }
            }

            // Hurdle collisions
            for (let h of hurdles) {
              if (!h.knocked && Math.abs(athlete.x - h.x) < 18) {
                if (athlete.y > athlete.baseY - 26) {
                  h.knocked = true;
                  athlete.knockTimer = 35;
                  athlete.speed = 0;
                  athlete.y = athlete.baseY;
                }
              }
            }

            if (athlete.speed > 0.5) {
              athlete.legFrame = (Math.floor(timerMs / 70) % 4);
            }

            cameraX = Math.max(0, athlete.x - 220);

            // Finish line at 2400
            if (athlete.x >= 2400) {
              state = 'FINISHED';
              const finalSec = timerMs / 1000;
              const rec = getRecords();
              if (rec.hurdles === 0 || finalSec < rec.hurdles) {
                localStorage.setItem('trackField_bestHurdles', finalSec);
                // Also update generic hub score
                localStorage.setItem('trackField_bestTime', finalSec);
                updateRecordDisplay();
              }
            }
          }
        }

        // ==========================
        // 2. EVENT: LONG JUMP
        // ==========================
        else if (currentEvent === 'longjump') {
          const foulLine = 580;

          if (state === 'RUNNING') {
            athlete.speed *= 0.985;
            athlete.x += athlete.speed;

            if (athlete.isHoldingAction) {
              athlete.angleDeg = (athlete.angleDeg + 3) % 90;
            }

            if (athlete.speed > 0.5) {
              athlete.legFrame = (Math.floor(athlete.x / 14) % 4);
            }

            // Auto-foul if running completely past takeoff board without jumping
            if (athlete.x > foulLine + 60) {
              athlete.isFoul = true;
              state = 'FINISHED';
            }
          } else if (state === 'ACTION') {
            // In Flight
            athlete.x += athlete.vx;
            athlete.vy += 0.58; // Gravity
            athlete.y += athlete.vy;

            // Landing in the sand pit
            if (athlete.y >= athlete.baseY) {
              athlete.y = athlete.baseY;
              state = 'FINISHED';

              if (!athlete.isFoul) {
                // Calculate distance in meters (pixels to meters scale)
                const distancePx = Math.max(0, athlete.x - foulLine);
                const meters = 6.20 + (distancePx / 48);
                athlete.distanceMeters = Math.min(9.10, meters);
                statValue.textContent = `${athlete.distanceMeters.toFixed(2)}M`;

                const rec = getRecords();
                if (athlete.distanceMeters > rec.longjump) {
                  localStorage.setItem('trackField_bestLongJump', athlete.distanceMeters);
                  updateRecordDisplay();
                }
              }
            }
          }
          cameraX = Math.max(0, athlete.x - 240);
        }

        // ==========================
        // 3. EVENT: JAVELIN THROW
        // ==========================
        else if (currentEvent === 'javelin') {
          const scratchLine = 600;

          if (state === 'RUNNING') {
            athlete.speed *= 0.985;
            athlete.x += athlete.speed;

            if (athlete.isHoldingAction) {
              athlete.angleDeg = (athlete.angleDeg + 2.5) % 85;
            }

            if (athlete.speed > 0.5) {
              athlete.legFrame = (Math.floor(athlete.x / 14) % 4);
            }

            // Auto-foul if passing scratch line without throwing
            if (athlete.x > scratchLine + 40) {
              athlete.isFoul = true;
              state = 'FINISHED';
            }
          } else if (state === 'ACTION') {
            // Javelin in Flight
            projectile.x += projectile.vx;
            projectile.vy += 0.52; // Javelin gravity
            projectile.y += projectile.vy;

            // Trajectory tilt follows velocity vector
            projectile.angleDeg = (Math.atan2(projectile.vy, projectile.vx) * 180) / Math.PI;

            // Landing on the field
            if (projectile.y >= athlete.baseY + 12) {
              projectile.y = athlete.baseY + 12;
              projectile.active = false;
              projectile.landed = true;
              state = 'FINISHED';

              if (!athlete.isFoul) {
                const distancePx = Math.max(0, projectile.x - scratchLine);
                const meters = 52.0 + (distancePx / 22);
                athlete.distanceMeters = Math.min(104.8, meters);
                statValue.textContent = `${athlete.distanceMeters.toFixed(2)}M`;

                const rec = getRecords();
                if (athlete.distanceMeters > rec.javelin) {
                  localStorage.setItem('trackField_bestJavelin', athlete.distanceMeters);
                  updateRecordDisplay();
                }
              }
            }
            cameraX = Math.max(0, projectile.x - 300);
          }
        }
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Stadium Crowd & Banners
        drawGrandstands();

        // 2. Track & Field Environment
        if (currentEvent === 'hurdles') {
          drawHurdlesEnvironment();
        } else if (currentEvent === 'longjump') {
          drawLongJumpEnvironment();
        } else if (currentEvent === 'javelin') {
          drawJavelinEnvironment();
        }

        // 3. Overlays & HUD Prompts
        if (state === 'READY') {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, 80, canvas.width, 80);
          ctx.fillStyle = '#ffe600';
          ctx.font = '16px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(countdown > 35 ? 'ON YOUR MARKS...' : 'SET... GO! 🏃‍♂️', canvas.width / 2, 128);
          ctx.textAlign = 'start';
        } else if (state === 'FINISHED') {
          ctx.fillStyle = 'rgba(0,0,0,0.85)';
          ctx.fillRect(0, 60, canvas.width, 140);
          ctx.textAlign = 'center';

          if (athlete.isFoul) {
            ctx.fillStyle = '#ff1744';
            ctx.font = '22px "Press Start 2P", monospace';
            ctx.fillText('FOUL! ❌', canvas.width / 2, 115);
            ctx.fillStyle = '#fff';
            ctx.font = '11px "Press Start 2P", monospace';
            ctx.fillText('CROSSED THE FOUL LINE BEFORE ACTION', canvas.width / 2, 145);
          } else {
            ctx.fillStyle = '#00e5ff';
            ctx.font = '20px "Press Start 2P", monospace';
            ctx.fillText('RECORD ATTEMPT COMPLETE! 🏅', canvas.width / 2, 105);
            ctx.fillStyle = '#ffd700';
            ctx.font = '14px "Press Start 2P", monospace';

            if (currentEvent === 'hurdles') {
              ctx.fillText(`TIME: ${(timerMs / 1000).toFixed(2)} SECONDS`, canvas.width / 2, 140);
            } else {
              ctx.fillText(`DISTANCE: ${athlete.distanceMeters.toFixed(2)} METERS`, canvas.width / 2, 140);
            }
          }

          ctx.fillStyle = '#fff';
          ctx.font = '10px "Press Start 2P", monospace';
          ctx.fillText('PRESS SPACE OR CLICK TO TRY AGAIN', canvas.width / 2, 175);
          ctx.textAlign = 'start';
        }

        // Angle meter UI while charging jump or throw
        if (athlete.isHoldingAction && state === 'RUNNING') {
          drawAngleGauge(athlete.x - cameraX + 10, athlete.y - 45, athlete.angleDeg);
        }
      }

      function drawGrandstands() {
        const crowdColors = ['#e91e63', '#9c27b0', '#2196f3', '#4caf50', '#ffeb3b', '#ff9800'];
        for (let row = 0; row < 5; row++) {
          const y = 20 + row * 24;
          ctx.fillStyle = row % 2 === 0 ? '#1b1b2f' : '#27273f';
          ctx.fillRect(0, y, canvas.width, 22);

          for (let col = 0; col < 32; col++) {
            const x = (col * 26) - (cameraX * 0.15) % 26;
            ctx.fillStyle = crowdColors[(col + row) % crowdColors.length];
            ctx.fillRect(x, y + 2, 10, 10);
            ctx.fillStyle = '#ffd180';
            ctx.fillRect(x + 2, y - 4, 6, 6);
          }
        }

        // Stadium Barrier Banner
        ctx.fillStyle = '#b71c1c';
        ctx.fillRect(0, 140, canvas.width, 24);
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillText('KONAMI • 1984 HYPER OLYMPIC GAMES', 120 - (cameraX * 0.25) % 450, 156);
      }

      function drawHurdlesEnvironment() {
        // Red synthetic track
        ctx.fillStyle = '#b23b23';
        ctx.fillRect(0, 164, canvas.width, 216);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 240, canvas.width, 3);
        ctx.fillRect(0, 315, canvas.width, 3);

        // Hurdles
        for (let h of hurdles) {
          const sx = h.x - cameraX;
          if (sx > -40 && sx < 820) {
            drawHurdle(sx, athlete.baseY + 12, h.knocked);
          }
        }

        // Finish line
        const finX = 2400 - cameraX;
        if (finX > -50 && finX < 850) {
          ctx.fillStyle = '#ffd700';
          ctx.fillRect(finX, 165, 8, 185);
          ctx.fillStyle = '#ffffff';
          ctx.font = '14px "Press Start 2P", monospace';
          ctx.fillText('FINISH', finX - 35, 195);
        }

        drawRunner(athlete.x - cameraX, athlete.y, '#ff3d00', '#ffd600', athlete.legFrame, athlete.y < athlete.baseY, athlete.knockTimer > 0);
      }

      function drawLongJumpEnvironment() {
        // Runway track
        ctx.fillStyle = '#b23b23';
        ctx.fillRect(0, 164, canvas.width, 150);

        const foulLine = 580;
        const screenFoulX = foulLine - cameraX;

        // Takeoff Board (White Wood) & Foul Plasticine Strip (Red)
        if (screenFoulX > -50 && screenFoulX < 850) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(screenFoulX - 18, 255, 18, 40);
          ctx.fillStyle = '#d50000';
          ctx.fillRect(screenFoulX, 255, 8, 40);
        }

        // Sand Pit
        const pitStart = screenFoulX + 8;
        if (pitStart < 850) {
          ctx.fillStyle = '#e6c280';
          ctx.fillRect(Math.max(0, pitStart), 245, Math.max(0, canvas.width - pitStart), 60);

          // Distance meter markers along sand pit
          ctx.fillStyle = '#333';
          ctx.font = '9px "Press Start 2P", monospace';
          for (let m = 7; m <= 9; m++) {
            const mx = (foulLine + (m - 6.2) * 48) - cameraX;
            if (mx > 0 && mx < canvas.width) {
              ctx.fillText(`${m}M`, mx, 290);
              ctx.fillRect(mx - 2, 250, 4, 12);
            }
          }
        }

        drawRunner(athlete.x - cameraX, athlete.y, '#ff3d00', '#ffd600', athlete.legFrame, state === 'ACTION', false);
      }

      function drawJavelinEnvironment() {
        // Red track runway up to scratch line
        ctx.fillStyle = '#b23b23';
        ctx.fillRect(0, 164, canvas.width, 150);

        const scratchLine = 600;
        const screenScratchX = scratchLine - cameraX;

        // Green Grass Field beyond scratch line
        if (screenScratchX < 850) {
          ctx.fillStyle = '#2e7d32';
          ctx.fillRect(Math.max(0, screenScratchX), 164, Math.max(0, canvas.width - screenScratchX), 150);

          // Scratch line arc
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(screenScratchX - 4, 230, 8, 80);

          // Distance Arc Lines (60m, 70m, 80m, 90m, 100m)
          ctx.fillStyle = '#ffffff';
          ctx.font = '9px "Press Start 2P", monospace';
          for (let m = 60; m <= 100; m += 10) {
            const mx = (scratchLine + (m - 52) * 22) - cameraX;
            if (mx > 0 && mx < canvas.width) {
              ctx.fillText(`${m}M`, mx, 210);
              ctx.fillRect(mx, 220, 3, 90);
            }
          }
        }

        // Draw Athlete
        drawRunner(athlete.x - cameraX, athlete.y, '#ff3d00', '#ffd600', athlete.legFrame, false, false);

        // Draw Javelin Spear
        if (projectile.active || projectile.landed) {
          ctx.save();
          ctx.translate(projectile.x - cameraX, projectile.y);
          ctx.rotate((projectile.angleDeg * Math.PI) / 180);

          // Javelin Shaft (Silver & Red grip)
          ctx.fillStyle = '#eeeeee';
          ctx.fillRect(-24, -2, 48, 4);
          ctx.fillStyle = '#d50000';
          ctx.fillRect(-6, -2, 12, 4); // Grip
          ctx.fillStyle = '#ffd700';
          ctx.fillRect(20, -2, 6, 4); // Tip
          ctx.restore();
        } else if (state === 'RUNNING') {
          // Held Javelin
          ctx.save();
          ctx.translate(athlete.x - cameraX + 8, athlete.y - 10);
          ctx.rotate((-20 * Math.PI) / 180);
          ctx.fillStyle = '#eeeeee';
          ctx.fillRect(-20, -2, 40, 3);
          ctx.restore();
        }
      }

      function drawAngleGauge(x, y, angle) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(x - 10, y - 10, 60, 24);
        ctx.fillStyle = '#00e5ff';
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillText(`${Math.floor(angle)}°`, x, y + 6);
      }

      function drawHurdle(x, y, knocked) {
        if (!knocked) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(x, y - 28, 6, 32);
          ctx.fillStyle = '#000000';
          ctx.fillRect(x, y - 28, 6, 6);
          ctx.fillRect(x, y - 16, 6, 6);
          ctx.fillStyle = '#cccccc';
          ctx.fillRect(x - 6, y + 2, 18, 3);
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(x - 10, y, 28, 5);
          ctx.fillStyle = '#000000';
          ctx.fillRect(x - 5, y, 6, 5);
        }
      }

      function drawRunner(x, y, shirtColor, shortsColor, legFrame, isJumping, isTripped) {
        if (isTripped) {
          ctx.fillStyle = '#ffd180';
          ctx.fillRect(x + 18, y + 10, 8, 8);
          ctx.fillStyle = shirtColor;
          ctx.fillRect(x, y + 12, 18, 8);
          ctx.fillStyle = shortsColor;
          ctx.fillRect(x - 12, y + 14, 12, 6);
          return;
        }

        // Head & Hair
        ctx.fillStyle = '#3e2723';
        ctx.fillRect(x + 2, y - 26, 12, 5);
        ctx.fillStyle = '#ffd180';
        ctx.fillRect(x + 3, y - 22, 10, 8);

        // Jersey Torso
        ctx.fillStyle = shirtColor;
        ctx.fillRect(x, y - 14, 14, 14);

        // Shorts
        ctx.fillStyle = shortsColor;
        ctx.fillRect(x + 1, y, 12, 8);

        // Animated Running Legs
        ctx.fillStyle = '#ffd180';
        if (isJumping) {
          ctx.fillRect(x + 12, y + 6, 16, 4);
          ctx.fillRect(x - 14, y + 6, 14, 4);
        } else {
          if (legFrame === 0) {
            ctx.fillRect(x + 2, y + 8, 4, 14);
            ctx.fillRect(x + 8, y + 8, 4, 8);
          } else if (legFrame === 1) {
            ctx.fillRect(x - 2, y + 8, 5, 12);
            ctx.fillRect(x + 10, y + 8, 5, 12);
          } else if (legFrame === 2) {
            ctx.fillRect(x + 2, y + 8, 4, 8);
            ctx.fillRect(x + 8, y + 8, 4, 14);
          } else {
            ctx.fillRect(x + 1, y + 6, 10, 10);
          }
        }
      }

      updateRecordDisplay();
      requestAnimationFrame(loop);

    })();
  </script>
</body>
</html>
