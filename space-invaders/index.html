<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d20"><title>Star Invaders | Retro Browser Games</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#172c55,#080d20 68%);color:#edf4ff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:20px}.cabinet{width:min(100%,560px);text-align:center}.home{display:inline-block;color:#7df9ff;text-decoration:none;font-weight:700;margin-bottom:12px}h1{font:clamp(24px,6vw,38px) monospace;letter-spacing:3px;color:#7df9ff;text-shadow:3px 3px #3156c5;margin:4px 0}.sub{color:#b4c6e8;margin:0 0 16px}.screen{position:relative;border:8px solid #35476a;border-radius:20px;background:#080d20;box-shadow:0 18px 60px #0009,inset 0 0 0 3px #101a33;overflow:hidden}canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;touch-action:none}.hud{position:absolute;inset:12px 14px auto;display:flex;justify-content:space-between;pointer-events:none;color:#fff;font:700 14px monospace;text-shadow:0 2px 4px #000}.overlay{position:absolute;inset:0;background:#080d20df;display:grid;place-items:center;padding:24px}.overlay[hidden]{display:none}.panel{max-width:340px}.panel h2{font:24px monospace;color:#ffe66d;margin:0 0 12px}.panel p{line-height:1.5;color:#d2e2ff}.action{border:0;border-radius:9px;padding:13px 22px;background:#7df9ff;color:#081124;font:800 15px monospace;cursor:pointer}.touch{display:flex;justify-content:center;gap:10px;margin:16px auto 10px}.touch button{min-width:85px;height:54px;border:1px solid #6085d5;border-radius:12px;background:#1d2b50;color:white;font:bold 18px monospace;touch-action:manipulation}.touch button:active{background:#3156c5}.touch #fire{background:#2c7e62;border-color:#5af0ad;min-width:110px}.hint{font-size:13px;color:#c0cee3;line-height:1.6}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head>
<body><main class="cabinet"><a class="home" href="../index.html">← ARCADE</a><h1>STAR INVADERS</h1><p class="sub">Hold the line. Send the pixel fleet packing.</p>
<div class="screen"><canvas id="game" width="480" height="640" aria-label="Star Invaders playfield" role="img" tabindex="0"></canvas><div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span>WAVE <b id="wave">1</b></span></div><div class="overlay" id="overlay"><div class="panel"><h2 id="headline">DEFEND EARTH</h2><p id="message">Move left and right, then fire at the descending fleet. Don't let them reach your ship!</p><button class="action" id="start">START GAME</button></div></div></div>
<div class="touch"><button id="left" aria-label="Move left">◀</button><button id="fire" aria-label="Fire">FIRE</button><button id="right" aria-label="Move right">▶</button></div><p class="hint">Move: <b>← →</b> or <b>A / D</b> · Fire: <b>Space</b> · Pause: <b>P</b><br>Mobile: use the buttons · Quiet arcade mode: always on</p><p class="sr" id="announcement" aria-live="polite"></p></main>
<script>(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),waveEl=document.getElementById('wave'),title=document.getElementById('headline'),msg=document.getElementById('message'),btn=document.getElementById('start');let best=Number(localStorage.getItem('starInvaders_highScore'))||0,score=0,wave=1,state='ready',player={x:220,y:574,w:40,h:25,cool:0},aliens=[],shots=[],enemyShots=[],keys={},formation={dir:1,speed:26,fire:0},stars=Array.from({length:60},()=>({x:Math.random()*480,y:Math.random()*640,r:Math.random()*1.5+0.3}));bestEl.textContent=best;
function createFleet(){aliens=[];for(let row=0;row<4;row++)for(let col=0;col<8;col++)aliens.push({x:58+col*50,y:106+row*42,w:27,h:19,row,col,alive:true})}
function reset(){score=0;wave=1;scoreEl.textContent='0';waveEl.textContent='1';player={x:220,y:574,w:40,h:25,cool:0};shots=[];enemyShots=[];formation={dir:1,speed:28,fire:0};createFleet();state='playing';overlay.hidden=true;c.focus({preventScroll:true})}
function gameOver(){state='over';title.textContent='SHIP DESTROYED';msg.textContent=`Final score: ${score}. The next wave is waiting.`;btn.textContent='PLAY AGAIN';overlay.hidden=false;document.getElementById('announcement').textContent=`Ship destroyed. Score ${score}.`}
function point(n){score+=n;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('starInvaders_highScore',best)}}
function shoot(){if(state!=='playing'||player.cool>0)return;shots.push({x:player.x+player.w/2-2,y:player.y-8,v:480});player.cool=.24}
function update(dt){if(keys.ArrowLeft||keys.a||keys.A)player.x-=270*dt;if(keys.ArrowRight||keys.d||keys.D)player.x+=270*dt;player.x=Math.max(12,Math.min(428,player.x));player.cool=Math.max(0,player.cool-dt);shots.forEach(s=>s.y-=s.v*dt);shots=shots.filter(s=>s.y>-10);enemyShots.forEach(s=>s.y+=s.v*dt);enemyShots=enemyShots.filter(s=>s.y<660);formation.fire-=dt;if(formation.fire<=0&&aliens.length){const shooters=aliens.filter(a=>a.alive);if(shooters.length){const a=shooters[Math.floor(Math.random()*shooters.length)];enemyShots.push({x:a.x+a.w/2,y:a.y+a.h,v:180+wave*14})}formation.fire=Math.max(.36,1.35-wave*.09+Math.random()*.7)}
let hitEdge=false;aliens.forEach(a=>{if(!a.alive)return;a.x+=formation.dir*formation.speed*dt;if(a.x<8||a.x+a.w>472)hitEdge=true});if(hitEdge){formation.dir*=-1;aliens.forEach(a=>{if(a.alive)a.y+=18});formation.speed+=7;if(aliens.some(a=>a.alive&&a.y+a.h>=player.y-14)){gameOver();return}}
for(const s of shots){const a=aliens.find(a=>a.alive&&s.x<a.x+a.w&&s.x+4>a.x&&s.y<a.y+a.h&&s.y+10>a.y);if(a){a.alive=false;s.y=-20;point((4-a.row)*10)}}for(const s of enemyShots){if(s.x>player.x&&s.x<player.x+player.w&&s.y>player.y&&s.y<player.y+player.h){gameOver();return}}
if(aliens.every(a=>!a.alive)){wave++;waveEl.textContent=wave;formation.speed+=12;createFleet();document.getElementById('announcement').textContent=`Wave ${wave}.`}}
function draw(){ctx.fillStyle='#080d20';ctx.fillRect(0,0,480,640);ctx.fillStyle='#bcd5ff';stars.forEach((s,i)=>{ctx.globalAlpha=.4+.35*Math.sin(performance.now()/500+i);ctx.fillRect(s.x,s.y, s.r,s.r)});ctx.globalAlpha=1;ctx.fillStyle='#52739c';ctx.font='12px monospace';ctx.fillText(`WAVE ${wave}`,18,68);
aliens.forEach(a=>{if(!a.alive)return;ctx.fillStyle=['#83f779','#97eb74','#b4e477','#d2d978'][a.row];ctx.fillRect(a.x+5,a.y,17,4);ctx.fillRect(a.x,a.y+5,27,8);ctx.fillRect(a.x+4,a.y+13,5,5);ctx.fillRect(a.x+18,a.y+13,5,5);ctx.fillStyle='#0a1740';ctx.fillRect(a.x+6,a.y+7,4,4);ctx.fillRect(a.x+17,a.y+7,4,4)});
ctx.fillStyle='#73d8ff';ctx.fillRect(player.x+17,player.y,7,6);ctx.fillRect(player.x+10,player.y+6,21,7);ctx.fillRect(player.x+4,player.y+13,33,9);ctx.fillRect(player.x,player.y+20,40,5);ctx.fillStyle='#fff';shots.forEach(s=>ctx.fillRect(s.x,s.y,4,10));ctx.fillStyle='#ff6687';enemyShots.forEach(s=>{ctx.fillRect(s.x-2,s.y,4,12);ctx.fillRect(s.x-5,s.y+4,10,4)});ctx.fillStyle='#244567';ctx.fillRect(0,610,480,2)}
let prev=0;function loop(t){const dt=Math.min((t-prev)/1000,.04)||0;prev=t;if(state==='playing')update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '){shoot()}if(e.key==='Enter'&&state!=='playing')reset();if((e.key==='p'||e.key==='P')&&state==='playing'){state='paused';title.textContent='PAUSED';msg.textContent='Press P to resume.';btn.textContent='RESUME';overlay.hidden=false}else if((e.key==='p'||e.key==='P')&&state==='paused'){state='playing';overlay.hidden=true}});window.addEventListener('keyup',e=>keys[e.key]=false);btn.addEventListener('click',()=>{if(state==='paused'){state='playing';overlay.hidden=true}else reset()});function hold(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(type=>b.addEventListener(type,()=>keys[key]=false));b.addEventListener('click',e=>{if(e.detail===0)player.x=Math.max(12,Math.min(428,player.x+(key==='ArrowLeft'?-45:45)))})}hold('left','ArrowLeft');hold('right','ArrowRight');const fire=document.getElementById('fire');fire.addEventListener('pointerdown',e=>{e.preventDefault();fire.setPointerCapture(e.pointerId);shoot()});fire.addEventListener('pointermove',e=>{if(e.buttons)shoot()});fire.addEventListener('click',e=>{if(e.detail===0)shoot()});requestAnimationFrame(loop)})();</script></body></html>
