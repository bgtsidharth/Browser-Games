<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hungry Hippos 🦛🔴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka+One&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #111a2e;
      color: #fff;
      font-family: 'Fredoka One', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
    }

    .top-nav {
      position: absolute;
      top: 12px;
      left: 18px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #00e5ff;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: #00e5ff;
      color: #111a2e;
    }

    .game-box {
      position: relative;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-header {
      text-align: center;
      margin-bottom: 8px;
    }

    .game-title {
      font-family: 'Bungee', cursive;
      font-size: clamp(24px, 5vw, 38px);
      color: #ff3366;
      text-shadow: 3px 3px 0 #ffe600, 0 6px 15px rgba(0,0,0,0.8);
      letter-spacing: 1px;
    }

    /* Score Board */
    .score-board {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
    }

    .score-chip {
      background: rgba(0,0,0,0.6);
      border: 2px solid #fff;
      border-radius: 12px;
      padding: 6px 16px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Arena Canvas */
    #arenaCanvas {
      width: 100%;
      max-width: 540px;
      height: 540px;
      background: radial-gradient(circle at 50% 50%, #0099cc 0%, #006699 65%, #003366 100%);
      border: 12px solid #ffaa00;
      border-radius: 50%;
      box-shadow:
        0 20px 50px rgba(0,0,0,0.9),
        inset 0 0 50px rgba(0,0,0,0.7);
      display: block;
      cursor: pointer;
    }

    /* Chomper Controls */
    .chomp-btn-container {
      margin-top: 12px;
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 540px;
      justify-content: center;
    }

    .btn-chomp {
      flex: 1;
      max-width: 260px;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: #fff;
      font-family: 'Bungee', cursive;
      font-size: 18px;
      padding: 12px 20px;
      border-radius: 999px;
      border: 3px solid #fff;
      box-shadow: 0 6px 15px rgba(255, 0, 85, 0.5);
      cursor: pointer;
      text-align: center;
      transition: transform 0.05s, box-shadow 0.05s;
    }

    .btn-chomp:active {
      transform: translateY(4px);
      box-shadow: 0 2px 6px rgba(255, 0, 85, 0.4);
    }

    .btn-reset {
      background: #2b2b45;
      border: 2px solid #fff;
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="../index.html" class="nav-btn">🎮 All Games</a>
  </nav>

  <main class="game-box">
    <header class="game-header">
      <h1 class="game-title">HUNGRY HIPPOS! 🦛🔴</h1>
    </header>

    <div class="score-board">
      <div class="score-chip" style="border-color: #ff3366;">
        <span>YOU:</span> <strong id="playerScore" style="color: #ff3366;">0</strong>
      </div>
      <div class="score-chip" style="border-color: #00e5ff;">
        <span>🏆 BEST:</span> <strong id="bestScore" style="color: #00e5ff;">0</strong>
      </div>
      <div class="score-chip" style="border-color: #00e676;">
        <span>CPU 1:</span> <strong id="cpu1Score" style="color: #00e676;">0</strong>
      </div>
      <div class="score-chip" style="border-color: #ffe600;">
        <span>CPU 2:</span> <strong id="cpu2Score" style="color: #ffe600;">0</strong>
      </div>
    </div>

    <canvas id="arenaCanvas" width="540" height="540"></canvas>

    <div class="chomp-btn-container">
      <button class="btn-chomp" id="btnChomp">CHOMP! 🦛 (SPACE)</button>
      <button class="btn-reset" id="btnReset">RELOAD MARBLES 🔄</button>
    </div>
  </main>

  <script>
    /* Hungry Hippos - 100% Silent Physical Tabletop Simulation */
    (function () {
      'use strict';

      const canvas = document.getElementById('arenaCanvas');
      const ctx = canvas.getContext('2d');
      const R = canvas.width / 2;

      const pScoreElem = document.getElementById('playerScore');
      const c1ScoreElem = document.getElementById('cpu1Score');
      const c2ScoreElem = document.getElementById('cpu2Score');
      const btnChomp = document.getElementById('btnChomp');
      const btnReset = document.getElementById('btnReset');

      // 4 Hippos: 0: Bottom (Player/Pink), 1: Left (Green CPU), 2: Top (Yellow CPU), 3: Right (Cyan CPU)
      const HIPPOS = [
        { angle: Math.PI / 2, color: '#ff3366', name: 'Player', neck: 0, state: 0, score: 0 },
        { angle: Math.PI,     color: '#00e676', name: 'CPU 1', neck: 0, state: 0, score: 0 },
        { angle: -Math.PI / 2, color: '#ffe600', name: 'CPU 2', neck: 0, state: 0, score: 0 },
        { angle: 0,           color: '#00b0ff', name: 'CPU 3', neck: 0, state: 0, score: 0 }
      ];

      let marbles = [];
      const TOTAL_MARBLES = 22;

      function spawnMarbles() {
        marbles = [];
        for (let i = 0; i < TOTAL_MARBLES; i++) {
          const dist = Math.random() * (R - 100);
          const angle = Math.random() * Math.PI * 2;
          marbles.push({
            x: R + Math.cos(angle) * dist,
            y: R + Math.sin(angle) * dist,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            radius: 8,
            color: i === 0 ? '#ffea00' : '#ffffff' // Golden marble gives 3 pts!
          });
        }
      }

      function triggerChomp(hippoIndex) {
        const h = HIPPOS[hippoIndex];
        if (h.state === 0) {
          h.state = 1; // extending
        }
      }

      btnChomp.addEventListener('pointerdown', () => triggerChomp(0));
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          triggerChomp(0);
        }
      });
      btnReset.addEventListener('click', () => {
        HIPPOS.forEach(h => h.score = 0);
        spawnMarbles();
        updateHUD();
      });

      const bestScoreElem = document.getElementById('bestScore');
      let hippoBestScore = parseInt(localStorage.getItem('hungryHippos_bestScore') || '0', 10);
      if (bestScoreElem) bestScoreElem.textContent = hippoBestScore;

      function updateHUD() {
        const pScore = HIPPOS[0].score;
        pScoreElem.textContent = pScore;
        c1ScoreElem.textContent = HIPPOS[1].score;
        c2ScoreElem.textContent = HIPPOS[2].score;

        if (pScore > hippoBestScore) {
          hippoBestScore = pScore;
          localStorage.setItem('hungryHippos_bestScore', hippoBestScore);
        }
        if (bestScoreElem) bestScoreElem.textContent = hippoBestScore;
      }

      function loop() {
        requestAnimationFrame(loop);
        update();
        render();
      }

      function update() {
        // AI CPUs randomly lunge when a marble is close
        for (let idx = 1; idx < 4; idx++) {
          const h = HIPPOS[idx];
          if (h.state === 0 && Math.random() < 0.05) {
            triggerChomp(idx);
          }
        }

        // Hippo neck extension and retraction physics
        for (let h of HIPPOS) {
          if (h.state === 1) { // Extending forward
            h.neck += 14;
            if (h.neck >= 105) {
              h.state = 2; // Jaw snaps shut at max reach
            }
          } else if (h.state === 2) { // Retracting back with gobble
            // Gobble marbles near mouth
            const mouthX = R + Math.cos(h.angle) * (R - 35 - h.neck);
            const mouthY = R + Math.sin(h.angle) * (R - 35 - h.neck);

            for (let i = marbles.length - 1; i >= 0; i--) {
              const m = marbles[i];
              const d = Math.hypot(m.x - mouthX, m.y - mouthY);
              if (d < 38) {
                // Gobbled!
                h.score += m.color === '#ffea00' ? 3 : 1;
                marbles.splice(i, 1);
                updateHUD();
              }
            }

            h.neck -= 9;
            if (h.neck <= 0) {
              h.neck = 0;
              h.state = 0; // ready
            }
          }
        }

        // Marbles physics and wall rebounds
        for (let m of marbles) {
          m.x += m.vx;
          m.y += m.vy;
          m.vx *= 0.992; // Friction
          m.vy *= 0.992;

          // Arena circular rim bounce
          const distFromCenter = Math.hypot(m.x - R, m.y - R);
          if (distFromCenter > R - 32) {
            const angle = Math.atan2(m.y - R, m.x - R);
            m.x = R + Math.cos(angle) * (R - 32);
            m.y = R + Math.sin(angle) * (R - 32);
            // Reflect velocity with bounce kick
            const normalX = Math.cos(angle);
            const normalY = Math.sin(angle);
            const dot = m.vx * normalX + m.vy * normalY;
            m.vx = (m.vx - 2 * dot * normalX) * 0.92;
            m.vy = (m.vy - 2 * dot * normalY) * 0.92;
            // Add jitter
            m.vx += (Math.random() - 0.5) * 1.5;
            m.vy += (Math.random() - 0.5) * 1.5;
          }
        }
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Center basin shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.arc(R, R, R - 40, 0, Math.PI * 2);
        ctx.fill();

        // Draw rolling marbles
        for (let m of marbles) {
          ctx.fillStyle = m.color;
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.3)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          // Marble specular shine
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.beginPath();
          ctx.arc(m.x - 2, m.y - 2, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw 4 Hippos
        for (let h of HIPPOS) {
          ctx.save();
          ctx.translate(R, R);
          ctx.rotate(h.angle - Math.PI / 2);

          // Hippo Base Body on the perimeter
          ctx.fillStyle = h.color;
          ctx.beginPath();
          ctx.arc(0, R - 20, 60, Math.PI, 0);
          ctx.fill();
          ctx.strokeStyle = '#222';
          ctx.lineWidth = 4;
          ctx.stroke();

          // Hippo Extending Neck
          const headY = R - 40 - h.neck;
          ctx.fillStyle = h.color;
          ctx.fillRect(-22, headY, 44, h.neck + 20);
          ctx.strokeRect(-22, headY, 44, h.neck + 20);

          // Hippo Big Head & Snout
          ctx.beginPath();
          ctx.arc(0, headY, 32, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Nostrils
          ctx.fillStyle = '#222';
          ctx.beginPath();
          ctx.arc(-10, headY - 14, 5, 0, Math.PI * 2);
          ctx.arc(10, headY - 14, 5, 0, Math.PI * 2);
          ctx.fill();

          // Cute Big Eyes
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(-16, headY + 12, 10, 0, Math.PI * 2);
          ctx.arc(16, headY + 12, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(-16, headY + 14, 5, 0, Math.PI * 2);
          ctx.arc(16, headY + 14, 5, 0, Math.PI * 2);
          ctx.fill();

          // Open/Closed Snapping Mouth
          if (h.state === 1) { // Gaping open
            ctx.fillStyle = '#800020';
            ctx.beginPath();
            ctx.ellipse(0, headY - 8, 20, 14, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }
      }

      spawnMarbles();
      requestAnimationFrame(loop);

    })();
  </script>
</body>
</html>
