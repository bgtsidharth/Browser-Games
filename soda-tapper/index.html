<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Soda Tapper 🍺🤠</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=Bungee&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #140d07;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
    }

    .top-nav {
      position: absolute;
      top: 12px;
      left: 18px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffd54f;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: #ffd54f;
      color: #140d07;
    }

    /* Saloon Arcade Cabinet Frame */
    .arcade-cabinet {
      position: relative;
      width: 100%;
      max-width: 820px;
      height: 520px;
      background: #3e2723;
      border-radius: 28px;
      border: 8px solid #5d4037;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
    }

    .saloon-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 760px;
      padding: 4px 10px 10px;
      font-size: 13px;
      color: #ffd54f;
    }

    #saloonCanvas {
      width: 100%;
      max-width: 760px;
      height: 380px;
      background: #2b1810;
      border: 4px solid #8d6e63;
      border-radius: 12px;
      display: block;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    }

    .mobile-controls {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 760px;
      margin-top: 10px;
      gap: 10px;
    }

    .tap-btn {
      background: #8d6e63;
      border: 3px solid #d7ccc8;
      border-radius: 14px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 10px 18px;
      cursor: pointer;
      flex: 1;
      text-align: center;
      box-shadow: 0 4px 0 #4e342e;
    }

    .tap-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #4e342e;
      background: #ffd54f;
      color: #3e2723;
    }

    .controls-hint {
      margin-top: 8px;
      font-size: 9px;
      color: #8d6e63;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="../index.html" class="nav-btn">🎮 All Games</a>
  </nav>

  <main class="arcade-cabinet">
    <div class="saloon-header">
      <div>SCORE: <span id="hudScore">0</span></div>
      <div>ROOT BEER TAPPER</div>
      <div>LIVES: <span id="hudLives">❤️❤️❤️</span></div>
    </div>

    <canvas id="saloonCanvas" width="760" height="380"></canvas>

    <div class="mobile-controls">
      <button class="tap-btn" id="btnUp">▲ UP BAR</button>
      <button class="tap-btn" id="btnDown">▼ DOWN BAR</button>
      <button class="tap-btn" id="btnPour" style="background: #e65100; border-color: #ffe082;">🍺 SLIDE SODA (SPACE)</button>
    </div>
  </main>

  <p class="controls-hint">
    KEYBOARD: <kbd>▲ Up</kbd> / <kbd>▼ Down</kbd> (or <kbd>W</kbd>/<kbd>S</kbd>) to switch counters &bull; <kbd>Space</kbd> to serve mugs &bull; Don't let thirsty patrons reach you!
  </p>

  <script>
    /* Retro Soda Tapper - 100% Silent Saloon Bartender Simulation */
    (function () {
      'use strict';

      const canvas = document.getElementById('saloonCanvas');
      const ctx = canvas.getContext('2d');

      const hudScore = document.getElementById('hudScore');
      const hudLives = document.getElementById('hudLives');

      // 4 Bar counters
      const LANES = [
        { y: 70, left: 160, right: 690 },
        { y: 150, left: 160, right: 690 },
        { y: 230, left: 160, right: 690 },
        { y: 310, left: 160, right: 690 }
      ];

      let playerLane = 0; // 0..3
      let score = 0;
      let lives = 3;
      let gameOver = false;

      // Entities
      let patrons = []; // { lane, x, speed, satisfied }
      let mugs = [];    // { lane, x, speed, isReturning }
      let spawnTimer = 0;
      let spawnRate = 140; // frames

      function resetGame() {
        score = 0;
        lives = 3;
        playerLane = 0;
        patrons = [];
        mugs = [];
        gameOver = false;
        spawnRate = 140;
        updateHUD();
      }

      function updateHUD() {
        hudScore.textContent = score;
        hudLives.textContent = '❤️'.repeat(Math.max(0, lives));
      }

      function pourDrink() {
        if (gameOver) {
          resetGame();
          return;
        }
        // Player serves a sliding drink down their current bar lane
        mugs.push({
          lane: playerLane,
          x: LANES[playerLane].right - 25,
          speed: -4.8,
          isReturning: false
        });
      }

      function movePlayer(dir) {
        if (gameOver) return;
        playerLane = Math.max(0, Math.min(3, playerLane + dir));
      }

      // Input handlers
      document.getElementById('btnUp').addEventListener('pointerdown', () => movePlayer(-1));
      document.getElementById('btnDown').addEventListener('pointerdown', () => movePlayer(1));
      document.getElementById('btnPour').addEventListener('pointerdown', pourDrink);

      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowUp' || e.code === 'KeyW') movePlayer(-1);
        else if (e.code === 'ArrowDown' || e.code === 'KeyS') movePlayer(1);
        else if (e.code === 'Space') pourDrink();
      });

      function spawnPatron() {
        const lane = Math.floor(Math.random() * 4);
        patrons.push({
          lane: lane,
          x: LANES[lane].left,
          speed: Math.random() * 0.7 + 0.9 + (score / 150),
          satisfied: false
        });
      }

      // Game Loop
      function loop() {
        requestAnimationFrame(loop);
        update();
        render();
      }

      function update() {
        if (gameOver) return;

        spawnTimer++;
        if (spawnTimer >= spawnRate) {
          spawnTimer = 0;
          spawnPatron();
          if (spawnRate > 55) spawnRate -= 1.5;
        }

        // 1. Move patrons toward the right (bartender side)
        for (let i = patrons.length - 1; i >= 0; i--) {
          const p = patrons[i];
          if (!p.satisfied) {
            p.x += p.speed;

            // If a patron reaches the right edge without a drink: LOSE A LIFE!
            if (p.x >= LANES[p.lane].right - 35) {
              patrons.splice(i, 1);
              lives--;
              updateHUD();
              if (lives <= 0) gameOver = true;
            }
          } else {
            // Satisfied patron slides back out the door!
            p.x -= 2.6;
            if (p.x <= LANES[p.lane].left) {
              patrons.splice(i, 1);
            }
          }
        }

        // 2. Move mugs
        for (let i = mugs.length - 1; i >= 0; i--) {
          const m = mugs[i];
          m.x += m.speed;

          if (!m.isReturning) {
            // Check collision with any thirsty patron in this lane
            let hit = false;
            for (let p of patrons) {
              if (p.lane === m.lane && !p.satisfied && Math.abs(p.x - m.x) < 22) {
                hit = true;
                p.satisfied = true;
                score += 50;
                updateHUD();
                // Empty mug starts sliding back toward bartender!
                m.isReturning = true;
                m.speed = 3.2;
                break;
              }
            }

            // If mug slides past the left door without being caught: LOSE A LIFE!
            if (!hit && m.x <= LANES[m.lane].left) {
              mugs.splice(i, 1);
              lives--;
              updateHUD();
              if (lives <= 0) gameOver = true;
            }
          } else {
            // Returning empty mug slides toward bartender
            if (m.x >= LANES[m.lane].right - 25) {
              // Did bartender catch it?
              if (playerLane === m.lane) {
                score += 100; // Bonus for catching empty mug!
                updateHUD();
                mugs.splice(i, 1);
              } else {
                // Smashed on floor!
                mugs.splice(i, 1);
                lives--;
                updateHUD();
                if (lives <= 0) gameOver = true;
              }
            }
          }
        }
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Saloon Wooden Floor Lines
        ctx.fillStyle = '#1e110b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw 4 Long Wooden Bar Counters
        for (let i = 0; i < LANES.length; i++) {
          const lane = LANES[i];

          // Saloon Doors on Left
          ctx.fillStyle = '#5d4037';
          ctx.fillRect(lane.left - 40, lane.y - 25, 36, 52);
          ctx.fillStyle = '#3e2723';
          ctx.fillRect(lane.left - 36, lane.y - 20, 28, 42);

          // Bar top counter
          ctx.fillStyle = '#a1887f';
          ctx.fillRect(lane.left, lane.y + 12, lane.right - lane.left, 16);
          // Polished brass rail
          ctx.fillStyle = '#ffd54f';
          ctx.fillRect(lane.left, lane.y + 26, lane.right - lane.left, 4);

          // Beer Keg Tap on Right
          ctx.fillStyle = '#cfd8dc';
          ctx.fillRect(lane.right + 2, lane.y - 15, 14, 28);
          ctx.fillStyle = '#ffd54f';
          ctx.fillRect(lane.right - 6, lane.y - 4, 10, 6);
        }

        // Draw Patrons (Cowboys / Aliens / Punk rock caricatures)
        for (let p of patrons) {
          const ly = LANES[p.lane].y;

          // Cowboy Hat
          ctx.fillStyle = '#6d4c41';
          ctx.beginPath();
          ctx.ellipse(p.x, ly - 18, 14, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(p.x - 7, ly - 26, 14, 10);

          // Head & Face
          ctx.fillStyle = '#ffcc80';
          ctx.beginPath();
          ctx.arc(p.x, ly - 8, 9, 0, Math.PI * 2);
          ctx.fill();

          // Torso
          ctx.fillStyle = p.satisfied ? '#4caf50' : '#d32f2f';
          ctx.fillRect(p.x - 8, ly + 1, 16, 20);

          // Thirsty eyes or happy face
          ctx.fillStyle = '#000';
          ctx.fillRect(p.x + 2, ly - 10, 2, 2);
        }

        // Draw Sliding Soda / Root Beer Mugs
        for (let m of mugs) {
          const ly = LANES[m.lane].y;

          // Glass Mug
          ctx.fillStyle = m.isReturning ? 'rgba(255,255,255,0.4)' : '#ffb300';
          ctx.fillRect(m.x - 7, ly + 2, 14, 16);

          // White Foamy Head
          if (!m.isReturning) {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(m.x, ly + 2, 8, 4, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          // Mug Handle
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.strokeRect(m.x + (m.speed < 0 ? 7 : -9), ly + 5, 4, 10);
        }

        // Draw Bartender at playerLane
        const bLane = LANES[playerLane];
        const bx = bLane.right + 25;
        const by = bLane.y;

        // Bartender Apron & Head
        ctx.fillStyle = '#ffcc80';
        ctx.beginPath();
        ctx.arc(bx, by - 12, 11, 0, Math.PI * 2);
        ctx.fill();
        // Mustache
        ctx.fillStyle = '#4e342e';
        ctx.fillRect(bx - 6, by - 9, 12, 4);
        // Bowtie
        ctx.fillStyle = '#d32f2f';
        ctx.fillRect(bx - 4, by - 1, 8, 4);
        // White shirt & Vest
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx - 10, by + 3, 20, 24);
        ctx.fillStyle = '#212121';
        ctx.fillRect(bx - 10, by + 3, 5, 24);
        ctx.fillRect(bx + 5, by + 3, 5, 24);

        // Game Over Banner
        if (gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.85)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#ffd54f';
          ctx.font = '22px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('SALOON OVERRUN!', canvas.width / 2, 170);
          ctx.fillStyle = '#fff';
          ctx.font = '13px "Press Start 2P", monospace';
          ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, 215);
          ctx.fillText('PRESS SPACE TO RESTART', canvas.width / 2, 255);
          ctx.textAlign = 'start';
        }
      }

      requestAnimationFrame(loop);

    })();
  </script>
</body>
</html>
