<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10091d"><title>Neon Breakout | Retro Browser Games</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#35204b,#10091d 66%);color:#fff4ff;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:20px}.cabinet{width:min(100%,560px);text-align:center}.home{display:inline-block;color:#ffb6e6;text-decoration:none;font-weight:700;margin-bottom:12px}h1{font:clamp(24px,6vw,38px) monospace;letter-spacing:3px;color:#ff69c9;text-shadow:3px 3px #7c2e9a;margin:4px 0}.sub{color:#d0b8dc;margin:0 0 16px}.screen{position:relative;border:8px solid #594365;border-radius:20px;background:#10091d;box-shadow:0 18px 60px #0009,inset 0 0 0 3px #15101b;overflow:hidden}canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;touch-action:none}.hud{position:absolute;inset:12px 14px auto;display:flex;justify-content:space-between;pointer-events:none;color:#fff;font:700 14px monospace;text-shadow:0 2px 4px #000}.overlay{position:absolute;inset:0;background:#10091ddd;display:grid;place-items:center;padding:24px}.overlay[hidden]{display:none}.panel{max-width:340px}.panel h2{font:24px monospace;color:#ffe45e;margin:0 0 12px}.panel p{line-height:1.5;color:#e6d6ee}.action{border:0;border-radius:9px;padding:13px 22px;background:#ff69c9;color:#250a2e;font:800 15px monospace;cursor:pointer}.touch{display:flex;justify-content:center;gap:18px;margin:16px auto 10px}.touch button{width:min(30vw,160px);height:54px;border:1px solid #b77cc6;border-radius:12px;background:#382644;color:white;font-size:22px;touch-action:manipulation}.touch button:active{background:#7c4790}.hint{font-size:13px;color:#cbb9d3;line-height:1.6}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head>
<body><main class="cabinet"><a class="home" href="../index.html">← ARCADE</a><h1>NEON BREAKOUT</h1><p class="sub">Clear the wall. Keep the ball in play.</p>
<div class="screen"><canvas id="game" width="480" height="640" aria-label="Neon Breakout playfield" role="img" tabindex="0"></canvas><div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span>LIVES <b id="lives">3</b></span></div><div class="overlay" id="overlay"><div class="panel"><h2 id="headline">READY?</h2><p id="message">Move the paddle with arrows or touch. Tap the screen or press Space to launch.</p><button class="action" id="start">START GAME</button></div></div></div>
<div class="touch"><button id="left" aria-label="Move paddle left">◀ LEFT</button><button id="right" aria-label="Move paddle right">RIGHT ▶</button></div><p class="hint">Move: <b>← →</b> or <b>A / D</b> · Launch: <b>Space</b> · Pause: <b>P</b><br>Touch the paddle buttons on mobile · No sound, just arcade glow</p><p class="sr" id="announcement" aria-live="polite"></p></main>
<script>(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),overlay=document.getElementById('overlay'),scoreText=document.getElementById('score'),bestText=document.getElementById('best'),livesText=document.getElementById('lives'),title=document.getElementById('headline'),msg=document.getElementById('message'),btn=document.getElementById('start');let best=Number(localStorage.getItem('neonBreakout_highScore'))||0,score=0,lives=3,level=1,state='ready',paddle={x:200,y:584,w:80,h:12},ball,bricks=[],keys={};bestText.textContent=best;
function makeBricks(){bricks=[];for(let r=0;r<5+Math.min(level-1,2);r++)for(let col=0;col<8;col++)bricks.push({x:26+col*54,y:94+r*26,w:48,h:17,hp:r<2?2:1,color:['#ff5b89','#ff9f43','#ffe45e','#61e6a5','#58c7ff','#b58cff','#ff7ada'][r]})}
function reset(){score=0;lives=3;level=1;paddle.x=200;scoreText.textContent=0;livesText.textContent=lives;makeBricks();attachBall();state='playing';overlay.hidden=true;c.focus({preventScroll:true})}
function attachBall(){ball={x:paddle.x+paddle.w/2,y:paddle.y-10,vx:0,vy:0,r:7,stuck:true}}attachBall();
function launch(){if(state==='ready')reset();if(state==='playing'&&ball.stuck){ball.stuck=false;ball.vx=(Math.random()-.5)*3;ball.vy=-5.1}}
function finish(win){state=win?'win':'over';title.textContent=win?'YOU CLEARED IT!':'GAME OVER';msg.textContent=win?`Nice run! Final score: ${score}.`:`Final score: ${score}. ${lives} lives left.`;btn.textContent='PLAY AGAIN';overlay.hidden=false;document.getElementById('announcement').textContent=win?'You cleared all the bricks!':`Game over. Score ${score}.`}
function scorePoint(n){score+=n;scoreText.textContent=score;if(score>best){best=score;bestText.textContent=best;localStorage.setItem('neonBreakout_highScore',best)}}
function update(dt){const speed=340*dt;if(keys.ArrowLeft||keys.a||keys.A)paddle.x-=speed;if(keys.ArrowRight||keys.d||keys.D)paddle.x+=speed;paddle.x=Math.max(8,Math.min(472-paddle.w,paddle.x));if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-10;return}ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;if(ball.x<ball.r||ball.x>480-ball.r)ball.vx*=-1;if(ball.y<ball.r+35)ball.vy=Math.abs(ball.vy);if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y<paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*5.2;ball.vy=-Math.max(4.4,Math.abs(ball.vy));ball.y=paddle.y-ball.r}
if(ball.y>650){lives--;livesText.textContent=lives;if(lives<=0){finish(false);return}attachBall();document.getElementById('announcement').textContent=`${lives} lives remaining.`}
for(const b of bricks){if(!b.hp||ball.x+ball.r<b.x||ball.x-ball.r>b.x+b.w||ball.y+ball.r<b.y||ball.y-ball.r>b.y+b.h)continue;b.hp--;ball.vy*=-1;if(!b.hp)scorePoint(10*level);break}
if(bricks.every(b=>!b.hp)){if(level>=3)finish(true);else{level++;makeBricks();attachBall();document.getElementById('announcement').textContent=`Level ${level}.`}}}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){x.fillStyle='#10091d';x.fillRect(0,0,480,640);x.strokeStyle='#ffffff0c';for(let i=20;i<480;i+=40){x.beginPath();x.moveTo(i,40);x.lineTo(i,640);x.stroke()}x.fillStyle='#b77cc6';x.font='12px monospace';x.fillText(`LEVEL ${level}`,18,66);bricks.forEach(b=>{if(!b.hp)return;rounded(b.x,b.y,b.w,b.h,4,b.color);x.fillStyle='#ffffff55';x.fillRect(b.x+4,b.y+3,b.w-8,2);if(b.hp===2){x.fillStyle='#fff';x.fillRect(b.x+b.w/2-2,b.y+7,4,4)}});rounded(paddle.x,paddle.y,paddle.w,paddle.h,6,'#ff69c9');x.shadowColor='#fff';x.shadowBlur=16;x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.shadowBlur=0;if(ball.stuck&&state==='playing'){x.fillStyle='#ffe45e';x.font='12px monospace';x.fillText('PRESS SPACE TO LAUNCH',147,544)}}
let prev=0;function loop(t){const dt=Math.min((t-prev)/1000,.04)||0;prev=t;if(state==='playing')update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '||e.key==='Enter')launch();if((e.key==='p'||e.key==='P')&&state==='playing'){state='paused';title.textContent='PAUSED';msg.textContent='Press P to resume.';btn.textContent='RESUME';overlay.hidden=false}else if((e.key==='p'||e.key==='P')&&state==='paused'){state='playing';overlay.hidden=true}});window.addEventListener('keyup',e=>keys[e.key]=false);btn.addEventListener('click',()=>{if(state==='paused'){state='playing';overlay.hidden=true}else reset()});c.addEventListener('pointerdown',e=>{const rect=c.getBoundingClientRect();paddle.x=(e.clientX-rect.left)/rect.width*480-paddle.w/2;launch()});c.addEventListener('pointermove',e=>{if(e.buttons){const rect=c.getBoundingClientRect();paddle.x=(e.clientX-rect.left)/rect.width*480-paddle.w/2}});const left=document.getElementById('left'),right=document.getElementById('right');left.addEventListener('pointerdown',e=>{e.preventDefault();keys.ArrowLeft=true});left.addEventListener('pointerup',()=>keys.ArrowLeft=false);left.addEventListener('pointerleave',()=>keys.ArrowLeft=false);left.addEventListener('click',e=>{if(e.detail===0)paddle.x-=45});right.addEventListener('pointerdown',e=>{e.preventDefault();keys.ArrowRight=true});right.addEventListener('pointerup',()=>keys.ArrowRight=false);right.addEventListener('pointerleave',()=>keys.ArrowRight=false);right.addEventListener('click',e=>{if(e.detail===0)paddle.x+=45});requestAnimationFrame(loop)})();</script></body></html>
